[package]
name = "zeroverse-meter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
walrus = "0.26"
anyhow = "1"
wasm-bindgen = { version = "=0.2.104", optional = true }

[features]
web = ["dep:wasm-bindgen"]

[[bin]]
name = "meter-cli"
path = "src/bin/meter-cli.rs"
